name: Rebuild from L&I

# The listings are pre-rendered, so they are only as fresh as the last build.
# Weekly is a deliberate compromise: L&I republishes on its own schedule, and
# rebuilding more often mostly produces commits where a few expiry dates moved.
# The live lookup on each page covers the gap in between.

on:
  schedule:
    - cron: '17 11 * * 1'        # Mondays, 11:17 UTC — early Monday in Seattle
  workflow_dispatch:              # and whenever you want it
  push:
    branches: [main]
    paths:                        # rebuild when the generator or data changes,
      - 'build/**'                # not when a listing page is committed, which
      - 'data/categories.js'      # would loop
      - 'assets/**'
      - '.github/workflows/rebuild.yml'

permissions:
  contents: write

concurrency:
  group: rebuild
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sanity-check the generator before it touches the repo
        run: |
          node --check build/prerender.js
          for f in build/lib/*.js assets/*.js; do node --check "$f"; done

      - name: Build against the fixture and run the checks
        run: |
          node build/make-fixture.js
          rm -rf /tmp/fixture-build && mkdir -p /tmp/fixture-build/data
          KCC_FIXTURE=test/fixtures/li.json node build/prerender.js --out /tmp/fixture-build
          node test/build.test.js /tmp/fixture-build

      - name: Pre-render from live L&I data
        env:
          # Optional. Unauthenticated Socrata requests are throttled by IP,
          # which a shared runner can trip. Add SOCRATA_APP_TOKEN under
          # Settings -> Secrets to lift that.
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: node build/prerender.js

      - name: Check the live build too
        run: node test/build.test.js .

      - name: Refuse to commit an implausible build
        run: |
          # A failed or partial fetch can still produce valid HTML — it would
          # just be a much smaller site. Rather than quietly publishing that,
          # stop and let someone look.
          pages=$(git status --porcelain | wc -l)
          active=$(node -e "console.log(require('./data/stats.json').active)")
          echo "active registrations: $active, changed files: $pages"
          if [ "$active" -lt 10000 ]; then
            echo "::error::Only $active active registrations. Expected 15,000+."
            echo "Refusing to publish — this looks like a partial fetch."
            exit 1
          fi

      - name: Commit whatever moved
        run: |
          rm -rf test/fixtures          # generated, not committed
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing changed since the last build."
            exit 0
          fi
          active=$(node -e "console.log(require('./data/stats.json').active)")
          git commit -m "Rebuild from L&I — ${active} active registrations

          Generated by .github/workflows/rebuild.yml"
          git push
